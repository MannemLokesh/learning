<!DOCTYPE html>
<html>

<head>
  <title>dig_the_technology | All PDF Files List</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <meta name="description"
    content="Documentation with Some Github examples are available in this site, especially related to Java technology.">
  <meta name="keywords"
    content="About MannemLokesh, Core Java MannemLokesh, JDBC MannemLokesh, Servlets & JSP MannemLokesh, Hibernate MannemLokesh, Spring MannemLokesh, Spring Boot MannemLokesh, DSA MannemLokesh, Docker MannemLokesh, Git MannemLokesh">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script>
    function toggleFunction() {
      const secondClass = $(element).attr('class')?.split(" ")[1];
      if (secondClass) {
        $(`#${secondClass}`).toggle();
      }
    }
    async function fetchAndPrintTopicsAsAccordians() {
        fetch(`./topics.json`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        })
        .then(data => {
            const htmlContent = data.map(item => `
                <div class="main">
                    <div class="div-menu-title" onclick="toggleFunction()">
                        <h4 class="menu-title ${item.reference_id}" onclick="fetchAndPrintConceptsAsCards('${item.reference_id}')">${item.name}</h2>
                    </div>
                    <div class="cards-div" id="${item.reference_id}">
                    </div>
                </div>
            `).join('');

            $(`body`).html(htmlContent);
        })
        .catch(error => {
            console.error('There was a problem with the fetch operation:', error);
        });

    }
    
    function fetchAndPrintConceptsAsCards(concept) {
      let classNames = $(`.${concept}`).attr('class');
      if (!classNames || !classNames.includes("content-added")) {
        fetch(`./${concept}.json`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            return response.json();
        })
        .then(data => {
            const htmlContent = data.map(item => `
                <div class="card">
                    <h5>${item.title}</h5>
                    <p class="scrollable-paragraph">${item.description}</p>
                    <a class="doc-git" href="${item.documentation.href}" target="${item.documentation.target == null ? "" : item.documentation.target}">Documentation</a>
                    <p></p>
                    <a class="doc-git" href="${item.github_examples.href}" target="${item.github_examples.target == null ? "" : item.github_examples.target}">Github Examples</a>
                </div>
            `).join('');

            $(`#${concept}`).html(htmlContent);
            $(`.${concept}`).addClass("content-added");
            $(".cards-div").show();
        })
        .catch(error => {
            console.error('There was a problem with the fetch operation:', error);
        });
      }
    }

    fetchAndPrintTopicsAsAccordians();
    // $(document).ready(function () {

    //     $(`#${$(this).attr('class').split(" ")[1]}`).toggle();
    //   });
    // });
  </script>
</head>
